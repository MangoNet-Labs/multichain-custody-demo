name: Custody reference checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  ledger-and-checkpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install local build and database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16 protobuf-compiler clang cmake pkg-config libssl-dev
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.96.1 1.88.0 --profile minimal
          rustup override set 1.96.1
          cd mango-worker && rustup override set 1.88.0
      - name: Workspace tests
        run: cargo test --locked --workspace
      - name: PostgreSQL, Mango fixtures and signed payout tests
        run: sh scripts/test-postgres.sh --mango

  fresh-docker-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sh scripts/test-docker-migrations.sh
