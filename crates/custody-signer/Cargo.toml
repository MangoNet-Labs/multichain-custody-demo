[package]
name = "custody-signer"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
alloy-primitives = {version="1",features=["k256"]}
alloy-consensus = {version="1",features=["k256"]}
alloy-sol-types = "1"
evm-reader = {path="../evm-reader"}
serde_json = "1"
serde = {version="1",features=["derive"]}
toml = "0.5"
anyhow = "1"
chacha20poly1305 = "0.10"
custody-core = { path = "../custody-core" }
custody-store = { path = "../custody-store" }
ed25519-dalek = "2"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time","process"] }
uuid = {version="1",features=["v4"]}
zeroize = "1"

[dev-dependencies]
axum = "0.8"
